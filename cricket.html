<!DOCTYPE html>
<html lang="en">
<head>
  <title>Cricket Game</title>
  <style>
    body {
      text-align: center;
    }
    .choice-image {
      height: 100px;

      
    }
    .button {
      height: 100px;
      width: 100px;
      border: none;
      margin: 10px;
      background-color: rgb(150, 177, 177);
      border-radius: 50px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Bat Ball Stump Game</h1>
  <button class="button" onclick="
  let computerChoice = generateComputerChoice();
  let resultMsg = getResult('Bat', computerChoice);
  showResult('Bat', computerChoice, resultMsg);
  "><img src="images/bat.png" alt="bat" class="choice-image"></button>

  <button class="button"  onclick="
    let computerChoice = generateComputerChoice();
    let resultMsg = getResult('Ball', computerChoice);
    showResult('Ball', computerChoice, resultMsg);
  "><img src="images/ball.png" alt="bat" class="choice-image"></button>

  <button  class="button" onclick="
    let computerChoice = generateComputerChoice();
    let resultMsg = getResult('Stump', computerChoice);
    showResult('Stump', computerChoice, resultMsg);
  "><img src="images/stump.png" alt="bat" class="choice-image"></button>

  
  
  <h3 id="user-move"></h3>
  <h3 id="computer-move"></h3>
  <h3 id="result"></h3>
  <h3 id="score"></h3>
  <button onclick="localStorage.clear()
  score ={
    win :0,
    lost:0,
    tie:0,
  }
  document.querySelector('#score').innerText=displayScore();">Reset</button>

  <script>
    let score;
    let scoreStr = localStorage.getItem('Score');
    score = JSON.parse(scoreStr) || {
      win: 0,
      lost: 0,
      tie: 0,
    };

    displayScore = function(){
        return `No of Matches Won ${score.win}, Lost ${score.lost},  Tie ${score.tie}`;
      };



    function generateComputerChoice() {
      //This will generate random number between 0 and 3
      let randomNumber = Math.random() * 3;
      if (randomNumber >= 0 && randomNumber <= 1) {
        return 'Bat';
      } else if (randomNumber > 1 && randomNumber <= 2) {
        return 'Ball';
      } else {
        return 'Stump';
      }
    }

    function getResult(userMove, computerMove) {
      if (userMove === 'Bat') {
        if (computerMove === 'Ball') {
          score.win++;
          return 'User won.';
        } else if (computerMove === 'Bat') {
          score.tie++;
          return `It's a tie`;
        } else if (computerMove === 'Stump') {
          score.lost++;
          return 'Computer has won';
        }
      } else if (userMove === 'Ball') {
        if (computerMove === 'Ball') {
          score.tie++;
          return `It's a tie`;
        } else if (computerMove === 'Bat') {
          score.lost++;
          return 'Computer has won';
        } else if (computerMove === 'Stump') {
          score.win++;
          return 'User won.';
        }
      } else {
        if (computerMove === 'Ball') {
          score.lost++;
          return 'Computer has won';
        } else if (computerMove === 'Bat') {
          score.win++;
          return 'User won.';
        } else if (computerMove === 'Stump') {
          score.tie++;
          return `It's a tie`;
        }
      }
    }

    function showResult(userMove, computerMove, result) {
      localStorage.setItem('Score',JSON.stringify(score));

      document.querySelector('#user-move').innerText=`You have chosen ${userMove}`;
      document.querySelector('#computer-move').innerText=`Computer choice is ${computerMove}`;
      document.querySelector('#result').innerText=` ${result}`;

      document.querySelector('#score').innerText=displayScore();     
    }
  </script>
</body>
</html>
